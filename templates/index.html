<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users List</title>
</head>
<body>
    <h1>List of Users</h1>
    <ul>
        {% for user in users %}
            <li>
                <a href="/user/{{ user.id }}">{{ user.name }}</a> - {{ user.email }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
